plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.miniappsampleapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.miniappsampleapp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    debugImplementation files("../miniappsdk/build/outputs/aar/miniappsdk-debug.aar")
    releaseImplementation files("../miniappsdk/build/outputs/aar/miniappsdk-release.aar")
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "com.github.bumptech.glide:glide:4.16.0"
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
}

tasks.named("preBuild").configure {
    dependsOn(":miniappsdk:assembleDebug", ":miniappsdk:assembleRelease")
}
