plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
    id 'signing'
}

group = "com.digitral"
version = "1.0.0"

android {
    namespace 'com.digitral.miniappsdk'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "MINIAPP_VERBOSE_LOGS", "true"
        }
        release {
            buildConfigField "boolean", "MINIAPP_VERBOSE_LOGS", "false"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

kotlin {
    explicitApi()
}

dependencies {

    // OkHttp
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"

    // Retrofit
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // Glide
    implementation "com.github.bumptech.glide:glide:4.16.0"

    // ViewPager2
    implementation "androidx.viewpager2:viewpager2:1.1.0"
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = "com.digitral"
            artifactId = "miniapp-android-sdk"
            version = "1.0.0"

            pom {
                name = "MiniApp Android SDK"
                description = "Android SDK for MiniApp service discovery and banner rendering."
                url = "https://github.com/krishdv11/MiniAppAndroidSDK.git"

                licenses {
                    license {
                        name = "MIT License"
                        url = "https://opensource.org/licenses/MIT"
                    }
                }

                developers {
                    developer {
                        id = "krishdv11"
                        name = "Krishna Murari"
                        email = "krishdv11@gmail.com"
                    }
                }

                scm {
                    connection = "scm:git:git://github.com/krishdv11/MiniAppAndroidSDK.git"
                    developerConnection = "scm:git:ssh://git@github.com/krishdv11/MiniAppAndroidSDK.git"
                    url = "https://github.com/krishdv11/MiniAppAndroidSDK.git"
                }
            }
        }
    }

    repositories {
        // For local testing: ./gradlew :miniappsdk:publishReleasePublicationToLocalRepoRepository
        maven {
            name = "localRepo"
            url = uri("${rootProject.layout.buildDirectory.get().asFile.absolutePath}/repo")
        }

        // Public/remote publishing target configured via gradle.properties or env vars.
        if (findProperty("PUBLISH_REPOSITORY_URL") || System.getenv("PUBLISH_REPOSITORY_URL")) {
            maven {
                name = "remote"
                url = uri(findProperty("PUBLISH_REPOSITORY_URL") ?: System.getenv("PUBLISH_REPOSITORY_URL"))
                credentials {
                    username = findProperty("PUBLISH_REPOSITORY_USERNAME") ?: System.getenv("PUBLISH_REPOSITORY_USERNAME")
                    password = findProperty("PUBLISH_REPOSITORY_PASSWORD") ?: System.getenv("PUBLISH_REPOSITORY_PASSWORD")
                }
            }
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release {
                from components.release
            }
        }
    }
}

signing {
    def signingKey = findProperty("SIGNING_KEY") ?: System.getenv("SIGNING_KEY")
    def signingPassword = findProperty("SIGNING_PASSWORD") ?: System.getenv("SIGNING_PASSWORD")
    if (signingKey && signingPassword) {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications
    }
}
