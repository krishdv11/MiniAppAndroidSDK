plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'com.google.dagger.hilt.android'
    id 'maven-publish'
    id 'signing'
}

group = findProperty("POM_GROUP_ID") ?: "com.digitral.miniappsdk"
version = findProperty("POM_VERSION") ?: "1.0.0"

android {
    namespace 'com.miniappsdk'
    compileSdk 34

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

kotlin {
    explicitApi()
}

dependencies {

    // Retrofit
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // Hilt
    implementation "com.google.dagger:hilt-android:2.48"
    kapt "com.google.dagger:hilt-compiler:2.48"

    // Glide
    implementation "com.github.bumptech.glide:glide:4.16.0"
}

publishing {
    publications {
        release(MavenPublication) {
            from components.release

            groupId = findProperty("POM_GROUP_ID") ?: "com.digitral.miniappsdk"
            artifactId = findProperty("POM_ARTIFACT_ID") ?: "miniappsdk"
            version = findProperty("POM_VERSION") ?: "1.0.0"

            pom {
                name = findProperty("POM_NAME") ?: "MiniApp SDK"
                description = findProperty("POM_DESCRIPTION") ?: "Android MiniApp SDK"
                url = findProperty("POM_URL") ?: "https://github.com/digitral/miniappsdk"

                licenses {
                    license {
                        name = findProperty("POM_LICENSE_NAME") ?: "The Apache License, Version 2.0"
                        url = findProperty("POM_LICENSE_URL") ?: "https://www.apache.org/licenses/LICENSE-2.0.txt"
                    }
                }

                developers {
                    developer {
                        id = findProperty("POM_DEVELOPER_ID") ?: "maintainer"
                        name = findProperty("POM_DEVELOPER_NAME") ?: "SDK Maintainer"
                        email = findProperty("POM_DEVELOPER_EMAIL") ?: "krishdv11@gmail.com"
                    }
                }

                scm {
                    connection = findProperty("POM_SCM_CONNECTION") ?: "scm:git:git://github.com/digitral/miniappsdk.git"
                    developerConnection = findProperty("POM_SCM_DEV_CONNECTION") ?: "scm:git:ssh://github.com:digitral/miniappsdk.git"
                    url = findProperty("POM_SCM_URL") ?: "https://github.com/digitral/miniappsdk"
                }
            }
        }
    }

    repositories {
        // For local testing: ./gradlew :miniappsdk:publishReleasePublicationToLocalRepoRepository
        maven {
            name = "localRepo"
            url = uri("${rootProject.layout.buildDirectory.get().asFile.absolutePath}/repo")
        }

        // Public/remote publishing target configured via gradle.properties or env vars.
        if (findProperty("PUBLISH_REPOSITORY_URL") || System.getenv("PUBLISH_REPOSITORY_URL")) {
            maven {
                name = "remote"
                url = uri(findProperty("PUBLISH_REPOSITORY_URL") ?: System.getenv("PUBLISH_REPOSITORY_URL"))
                credentials {
                    username = findProperty("PUBLISH_REPOSITORY_USERNAME") ?: System.getenv("PUBLISH_REPOSITORY_USERNAME")
                    password = findProperty("PUBLISH_REPOSITORY_PASSWORD") ?: System.getenv("PUBLISH_REPOSITORY_PASSWORD")
                }
            }
        }
    }
}

signing {
    def signingKey = findProperty("SIGNING_KEY") ?: System.getenv("SIGNING_KEY")
    def signingPassword = findProperty("SIGNING_PASSWORD") ?: System.getenv("SIGNING_PASSWORD")
    if (signingKey && signingPassword) {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications
    }
}
